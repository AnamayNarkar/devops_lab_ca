name: Release

# Push a tag like v0.1.0 to build, test and publish executables.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t skyline-weather:test .

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     target: linux-x64,     ext: "" }
          - { runner: ubuntu-24.04-arm, target: linux-arm64,   ext: "" }
          - { runner: windows-latest,   target: windows-x64,   ext: ".exe" }
          - { runner: windows-11-arm,   target: windows-arm64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build executable
        run: >
          pyinstaller --onefile --windowed --name skyline-weather-${{ matrix.target }}
          --collect-all customtkinter main.py
      - name: Checksum
        shell: bash
        run: |
          cd dist
          f=$(ls skyline-weather-${{ matrix.target }}*)
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: skyline-weather-${{ matrix.target }}
          path: dist/skyline-weather-${{ matrix.target }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
            --title "Skyline Weather $TAG" --generate-notes
