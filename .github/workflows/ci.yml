name: CI

# Linux is tested inside Docker (see the "test" stage in the Dockerfile).
# Windows is tested natively, because GitHub's Windows runners cannot run Linux containers.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux-docker:
    name: Test Linux (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests and GUI smoke test
        run: docker build --target test -t skyline-weather:test .

  test-windows:
    name: Test Windows (native)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: GUI smoke test
        shell: bash
        run: PYTHONPATH=. python tests/smoke_gui.py

  build-check:
    name: Linux build in Docker
    needs: test-linux-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux executable
        run: |
          docker build --target artifact --output dist .
          ls -l dist
