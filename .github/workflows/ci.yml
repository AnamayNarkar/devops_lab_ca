name: CI

# All testing runs inside Docker (see the "test" stage in the Dockerfile).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests and GUI smoke test
        run: docker build --target test -t skyline-weather:test .

  build-check:
    name: Linux build in Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux executable
        run: |
          docker build --target artifact --output dist .
          ls -l dist
